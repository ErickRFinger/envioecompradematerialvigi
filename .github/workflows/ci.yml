name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify package.json exists
        run: test -f package.json

      - name: Install dependencies (if package-lock.json exists)
        run: npm ci 2>/dev/null || npm install 2>/dev/null || echo "No dependencies to install"

      - name: Run test suite
        run: npm test