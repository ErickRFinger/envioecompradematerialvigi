<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Envio VIGI - Redirecionamento Canônico</title>
  <!--
    REDIRECT STUB (fonte única de verdade).
    Este arquivo NÃO é mais uma cópia do dashboard: é apenas um redirect.
    A aplicação real vive em index.html (Matriz) e solicitar.html (Mobile).
    Manter duas cópias do mesmo HTML causava divergência de segurança:
    um patch de XSS no index.html não chegava ao duplicado.
  -->
  <meta http-equiv="refresh" content="0;url=/index.html">
  <link rel="icon" href="favicon.ico">
  <script>
    // Fallback caso o meta-refresh não surtisse efeito imediato.
    setTimeout(function () { window.location.href = '/index.html'; }, 600);
  </script>
</head>
<body style="font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <div style="text-align:center;">
    <h1 style="color:#fd5f00;font-size:1.4rem;margin:0 0 8px;">⚠️ Redirecionando…</h1>
    <p style="color:#94a3b8;margin:0;">Clique <a href="/index.html" style="color:#fbbf24;text-decoration:underline;">aqui</a> para ir direto ao painel.</p>
  </div>
</body>
</html>
